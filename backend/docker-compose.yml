services:
  postgres:
    image: postgres:16-alpine
    container_name: sih-brsr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: sih_brsr
    ports:
      - "5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih_brsr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: sih-brsr-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://sih:${POSTGRES_PASSWORD}@postgres:5432/sih_brsr?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: ./uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sih_uploads:/app/uploads

volumes:
  sih_pgdata:
  sih_uploads:
